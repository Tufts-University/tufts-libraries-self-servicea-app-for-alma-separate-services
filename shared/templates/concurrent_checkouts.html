{% extends "base.html" %}
{% block content %}

<h2 style="color:blue">ALMA PROD</h2>
<h2>Concurrent Checkouts <a class="help-icon" href="/help#concurrent-checkouts" title="Concurrent Checkouts Help" aria-label="Concurrent Checkouts Help">{{render_help_button("Concurrent Checkouts Help")}}</a></h2>



<!-- Template Download -->
<p>
    <a href="{{ url_for('static', filename='Tisch Laptops - Concurrent Checkouts.xlsx') }}"
       class="btn btn-primary"
       download>
        Download Template Spreadsheet
    </a>
</p>

<!-- Upload Form -->
<form action="/concurrent_checkouts/upload" name="fileUpload" method="post" enctype="multipart/form-data" onsubmit="submitFormWithFetch(event, this); return false;">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>

{% endblock %}
